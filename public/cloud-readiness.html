<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud Readiness Checker</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
      max-width: 700px;
      margin: auto;
      background: #f9f9f9;
    }
    h1 {
      text-align: center;
      color: #e26822;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }
    select, input, button {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 1.5rem;
      background: #343638;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .score {
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      margin-top: 2rem;
      padding: 1rem;
      border-radius: 10px;
    }
    .low {
      background: #f8d7da;
      color: #ec201d;
      border: 1px solid #f5c6cb;
    }
    .medium {
      background: #fff3cd;
      color: #f3b90a;
      border: 1px solid #ffeeba;
    }
    .high {
      background: #d4edda;
      color: #15d642;
      border: 1px solid #c3e6cb;
    }
  </style>
</head>
<body>

  <h1>Cloud Readiness Checker</h1>

  <form id="readinessForm">

    <label for="env">Current IT Infrastructure:</label>
    <select id="env">
      <option value="1">On‑Premises</option>
      <option value="2">Hybrid</option>
      <option value="3">Cloud‑Native</option>
    </select>

    <label for="team">Do you have an internal IT team?</label>
    <select id="team">
      <option value="1">No</option>
      <option value="2">Partially</option>
      <option value="3">Yes</option>
    </select>

    <!-- Step 2 -->
    <label for="backup">Do you have a regular data backup process?</label>
    <select id="backup">
      <option value="1">No</option>
      <option value="2">Somewhat</option>
      <option value="3">Yes</option>
    </select>

    <label for="compliance">Are security and compliance standards in place?</label>
    <select id="compliance">
      <option value="1">Not Yet</option>
      <option value="2">Partially</option>
      <option value="3">Fully</option>
    </select>

    <label for="budget">Do you have a cloud migration budget allocated?</label>
    <select id="budget">
      <option value="1">No</option>
      <option value="2">Maybe</option>
      <option value="3">Yes</option>
    </select>

    <!-- Step 3 -->
    <label for="apps">How many critical applications do you use?</label>
    <select id="apps">
      <option value="1">Few (< 5)</option>
      <option value="2">Moderate (5–20)</option>
      <option value="3">Many (> 20)</option>
    </select>

    <label for="timeline">What is your ideal migration timeline?</label>
    <select id="timeline">
      <option value="1">6+ months</option>
      <option value="2">3–6 months</option>
      <option value="3">< 3 months</option>
    </select>

    <button type="button" id="checkBtn">Check Readiness</button>
  </form>

  <div id="score" class="score"></div>

  <script>
    const form = document.getElementById('readinessForm');
    const scoreEl = document.getElementById('score');

    document.getElementById('checkBtn').addEventListener('click', () => {
      const values = Array.from(form.elements)
        .filter(el => el.tagName === 'SELECT')
        .map(el => parseInt(el.value));
      
      const total = values.reduce((a, b) => a + b, 0);
      let level = '';
      let cssClass = '';

      if (total <= 10) {
        level = 'Low Readiness';
        cssClass = 'low';
      } else if (total <= 16) {
        level = 'Medium Readiness';
        cssClass = 'medium';
      } else {
        level = 'High Readiness';
        cssClass = 'high';
      }

      scoreEl.className = 'score ' + cssClass;
      scoreEl.textContent = `${level} (${total} / 21)`;
    });
  </script>
</body>
</html>
