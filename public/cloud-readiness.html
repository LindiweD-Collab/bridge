<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cloud Readiness Assessment | TechBridge Innovations</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #e0f2f1, #e8f5e9);
      margin: 0;
      padding: 0;
    }

    header {
      background: linear-gradient(to right, #eb5325, #d46906);
      color: white;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h1, h2 {
      text-align: center;
      color: #1f2937;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
      color: #374151;
    }

    select, input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background-color: #f9fafb;
      transition: border 0.3s;
      font-size: 1rem;
    }

    select:focus, input:focus, textarea:focus {
      border-color: #3b82f6;
      outline: none;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      background-image: linear-gradient(to right, #f6573b, #d46906);
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 30px;
      transition: background 0.3s ease;
    }

    button:hover {
      background-image: linear-gradient(to right, #eb5325, #d46906);
    }

    .result-box {
      margin-top: 40px;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(0,0,0,0.05);
    }

    .score {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .fit-high {
      background-color: #dcfce7;
      color: #166534;
      border: 2px solid #22c55e;
    }

    .fit-medium {
      background-color: #fef9c3;
      color: #854d0e;
      border: 2px solid #eab308;
    }

    .fit-low {
      background-color: #fee2e2;
      color: #991b1b;
      border: 2px solid #ef4444;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌐 Cloud Readiness Assessment</h1>
    <p>Find out if your business is ready for cloud migration</p>
  </header>

  <div class="container">
    <form id="assessmentForm">
      <h2> Step 1: Your Tech & Team</h2>

      <label for="it">Current IT Infrastructure</label>
      <select id="it" required>
        <option value="">Select one...</option>
        <option value="2">On-prem only</option>
        <option value="4">Hybrid (on-prem + cloud)</option>
        <option value="5">Cloud-first</option>
      </select>

      <label for="team">Do you have an internal IT team?</label>
      <select id="team" required>
        <option value="">Select one...</option>
        <option value="3">No</option>
        <option value="4">Yes, small</option>
        <option value="5">Yes, dedicated</option>
      </select>

      <h2> Step 2: Security & Planning</h2>

      <label for="backup">Do you have a regular data backup process?</label>
      <select id="backup" required>
        <option value="">Select one...</option>
        <option value="2">No</option>
        <option value="4">Partially</option>
        <option value="5">Yes</option>
      </select>

      <label for="security">Are security and compliance standards in place?</label>
      <select id="security" required>
        <option value="">Select one...</option>
        <option value="2">No</option>
        <option value="4">Some policies</option>
        <option value="5">Fully compliant</option>
      </select>

      <label for="budget">Do you have a cloud migration budget allocated?</label>
      <select id="budget" required>
        <option value="">Select one...</option>
        <option value="2">No budget</option>
        <option value="4">Tentative budget</option>
        <option value="5">Fully budgeted</option>
      </select>

      <button type="submit"> Check My Readiness</button>
    </form>

    <div id="result" class="result-box" style="display:none;">
      <div class="score" id="scoreText"></div>
      <div id="fitLevel"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById("assessmentForm");
    const resultBox = document.getElementById("result");
    const scoreText = document.getElementById("scoreText");
    const fitLevel = document.getElementById("fitLevel");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const scores = [
        parseInt(document.getElementById("it").value),
        parseInt(document.getElementById("team").value),
        parseInt(document.getElementById("backup").value),
        parseInt(document.getElementById("security").value),
        parseInt(document.getElementById("budget").value)
      ];

      const total = scores.reduce((a, b) => a + b, 0);
      const avg = Math.round(total / scores.length);

      resultBox.style.display = "block";

      scoreText.textContent = `Readiness Score: ${avg}/5`;

      if (avg >= 4.5) {
        resultBox.className = "result-box fit-high";
        fitLevel.textContent = "✅ You're Cloud-Ready! Migration can begin.";
      } else if (avg >= 3) {
        resultBox.className = "result-box fit-medium";
        fitLevel.textContent = "🛠 You're almost there. Let's fix a few gaps.";
      } else {
        resultBox.className = "result-box fit-low";
        fitLevel.textContent = "🚧 Not ready yet. Let's help you prepare properly.";
      }
    });
  </script>

</body>
</html>
